
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Personal Expense Tracker</h1>
        <p>Track your spending and manage your money.</p>

        <h2>Add New Expense</h2>

        <form id="expense-form">

            <label for="expense-name">Expense Name</label>
            <input type="text" id="expense-name"
                   placeholder="Example: Coffee" required>
            
            <label for="expense-date">Expense Date</label>
            <input type="date" id="expense-date" required>
       

            <label for="expense-amount">Amount ($)</label>
            <input type="number" id="expense-amount"
                   placeholder="Example: 5.50"
                   min="0.01" step="0.01" required>

            <label for="expense-category">Category</label>
            <select id="expense-category">
                <option value="Food">Food</option>
                <option value="Shopping">Shopping</option>
                <option value="Transportation">Transportation</option>
                <option value="Bills">Bills</option>
                <option value="Other">Other</option>
            </select>

            <button type="submit">Add Expense</button>

        </form>

        <h2>Total Spending</h2>
        <h3 id="total-spending">$0.00</h3>


<div class="chart-section">
    <h2>Spending by Category</h2>
    <p>See where your money goes.</p>

    <div id="category-chart"></div>
</div>

<div class="import-section">
    <h2>Import Expenses</h2>
    <p>Upload a CSV file to add multiple expenses at once.</p>

    <input
        type="file"
        id="csv-file"
        accept=".csv,text/csv"
    >

    <button type="button" id="import-button">
        Import CSV
    </button>

    <p id="import-message"></p>
</div>

        
<h2>My Expenses</h2>

<div class="month-filter">
    <label for="filter-month">Filter by Month</label>
    <input type="month" id="filter-month">
    <button type="button" id="clear-filter">Show All</button>
</div>

<p id="monthly-total"></p>

<ul id="expense-list"></ul>

        

    </div>

    <script src="script.js"></script>

</body>
</html>
